<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2732 2732">
  <!-- Background -->
  <rect width="2732" height="2732" fill="#0f172a"/>

  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="splashGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#14b8a6"/>
    </linearGradient>
  </defs>

  <!-- Centered Logo Container -->
  <g transform="translate(1366, 1200)">
    <!-- Background circle -->
    <circle cx="0" cy="0" r="220" fill="url(#splashGradient)" opacity="0.15"/>

    <!-- Activity Icon -->
    <g transform="scale(0.35)">
      <!-- Pulse line -->
      <path
        d="M-400 0 L-200 0 L-100 -200 L0 200 L100 -200 L200 0 L400 0"
        fill="none"
        stroke="url(#splashGradient)"
        stroke-width="60"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </g>
  </g>

  <!-- App Name -->
  <text
    x="1366"
    y="1520"
    text-anchor="middle"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="100"
    font-weight="700"
    fill="white"
  >VitalFlow</text>

  <!-- Tagline -->
  <text
    x="1366"
    y="1600"
    text-anchor="middle"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="40"
    fill="#64748b"
  >Your Personal Health Companion</text>
</svg>
